name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Unzip PWA APK project
        run: |
          unzip -o MyChrysler300C_PWA_APK_V12_PROJECT.zip

      - name: Show files
        run: |
          ls -R

      - name: Build APK
        run: |
          cd MyChrysler300C_PWA_APK_V12
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyChrysler300C-PWA-APK-V12
          path: MyChrysler300C_PWA_APK_V12/app/build/outputs/apk/debug/*.apk
